<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>GreenEcoChain - Квесты</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --green-dark: #086B3C;
            --green-accent: #1FA84B;
            --token-bg: #408C68;
            --text-color: #000000;
            --header-dark: #2c2c2c;
            --btn-dark: #0e8b3f; 
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(180deg, #FFFFFF 0%, var(--green-dark) 100%);
            color: var(--text-color);
            min-height: 100vh;
        }

        /* ШАПКА САЙТА (HEADER) */
        header {
            width: 100%;
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        .header-top {
            background: var(--header-dark); 
            color: #FFFFFF;
            padding: 15px 5%; 
            display: flex;
            justify-content: space-between; 
            align-items: center;
        }
        .logo { 
            font-family: 'Inter', sans-serif; 
            font-size: 24px; 
            font-weight: 800;
            letter-spacing: 1px;
        }
        .profile-circle {
            width: 36px; height: 36px; border-radius: 50%;
            background: #D8F6E8; color: var(--green-dark);
            font-weight: 700; display: flex; align-items: center;
            justify-content: center; font-size: 16px;
        }
        .navigation-bar {
            background: #FFFFFF; 
            border-radius: 0 0 25px 25px;
            padding: 12px 5%; 
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }
        .nav-links { 
            display: flex; 
            justify-content: space-around; 
            list-style: none; 
            max-width: 800px;
            margin: 0 auto;
        }
        .nav-link a {
            text-decoration: none; 
            color: #333333; 
            font-size: 15px;
            font-weight: 600; 
            padding: 5px 15px; 
            transition: color 0.3s, border-color 0.3s;
            border-bottom: 3px solid transparent;
        }
        .nav-link.active a { 
            color: var(--green-accent); 
            border-bottom: 3px solid var(--green-accent); 
        }

        /* КОНТЕНТ КВЕСТОВ */
        .quest-container { 
            padding: 40px 5%; 
            max-width: 1200px; 
            margin: 0 auto;
        }
        .main-title {
            font-size: 44px; 
            font-weight: 800; 
            color: #FFFFFF;
            margin-bottom: 30px;
        }
        .cards-grid {
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 30px;
        }
        .quest-card {
            background: #FFFFFF; 
            border-radius: 20px; 
            padding: 30px 20px;
            display: flex; 
            flex-direction: column; 
            align-items: center;
            text-align: center; 
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.2);
            position: relative; 
            min-height: 380px;
            transition: transform 0.3s;
        }
        .quest-card:hover { transform: translateY(-5px); }

        .token-badge {
            position: absolute; top: 0; right: 0; 
            background: var(--token-bg);
            color: #FFFFFF; 
            padding: 8px 15px; 
            border-radius: 0 20px 0 15px;
            font-weight: 700; font-size: 14px;
        }
        .quest-icon {
            width: 100px;
            height: 100px;
            margin: 20px 0 15px; 
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 60px;
        }
        
        .quest-description { 
            font-size: 18px; 
            font-weight: 600; 
            margin-bottom: 15px;
            flex-grow: 1; 
            color: #333;
        }
        .progress-bar-container {
            width: 90%; 
            height: 10px; 
            background: #DFEEE0;
            border-radius: 5px; 
            margin-bottom: 10px; 
            overflow: hidden;
        }
        .progress-bar { 
            height: 100%; 
            background: var(--green-accent); 
            border-radius: 5px; 
            transition: width 0.5s;
        }
        .progress-text { 
            font-size: 16px; 
            font-weight: 600; 
            color: var(--text-color); 
            margin-bottom: 20px;
        }
        
        .action-btn {
            padding: 12px 25px;
            border-radius: 25px;
            border: none;
            font-weight: 700;
            cursor: pointer;
            width: 90%;
            transition: background 0.2s, transform 0.2s, box-shadow 0.2s;
            background: var(--btn-dark); 
            color: white;
            font-size: 16px;
        }
        .action-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(14, 139, 63, 0.3);
        }
        .action-btn.completed-btn {
            background: var(--green-accent); 
            box-shadow: 0 6px 15px rgba(40, 167, 69, 0.4);
            border: 2px solid #FFFFFF;
        }
        .action-btn.completed-btn:hover {
            background: #1b9a3c;
        }
    </style>
</head>
<body>

    <header>
        <div class="header-top">
            <div class="logo">ECOCHAIN</div>
            <div class="profile-circle">А</div>
        </div>
        <nav class="navigation-bar">
            <ul class="nav-links">
                <li class="nav-link"><a href="index.html">Главное</a></li>
                <li class="nav-link active"><a href="quest.html">Квест</a></li>
                <li class="nav-link"><a href="leaderboard.html">Таблица лидеров</a></li>
                <li class="nav-link"><a href="profile.html">Профиль</a></li>
            </ul>
        </nav>
    </header>

    <main class="quest-container">
        <h1 class="main-title">Активные Эко-Квесты</h1>

        <div class="cards-grid">
            <div class="quest-card">
                <div class="token-badge">+50 SECO Tokens</div>
                <div class="quest-icon">🌱</div> 
                <div class="quest-description">Посади дерево</div>
                <div class="progress-bar-container">
                    <div class="progress-bar" style="width: 75%;"></div>
                </div>
                <div class="progress-text">75%</div>
                <button class="action-btn completed-btn">Завершить квест!</button>
            </div>

            <div class="quest-card">
                <div class="token-badge">+50 SECO Tokens</div>
                <div class="quest-icon">♻️</div>
                <div class="quest-description">Сдай 5 кг макулатуры</div>
                <div class="progress-bar-container">
                    <div class="progress-bar" style="width: 30%;"></div>
                </div>
                <div class="progress-text">30%</div>
                <button class="action-btn">Подробнее</button>
            </div>

            <div class="quest-card">
                <div class="token-badge" style="background: var(--green-accent);">+100 SECO Tokens</div>
                <div class="quest-icon">🧹</div>
                <div class="quest-description">Участвуй в субботнике</div>
                <div class="progress-bar-container">
                    <div class="progress-bar" style="width: 0%;"></div>
                </div>
                <div class="progress-text">0%</div>
                <button class="action-btn">Начать</button>
            </div>
            
            <div class="quest-card">
                <div class="token-badge" style="background: #a84b1f;">+20 SECO Tokens</div>
                <div class="quest-icon">💧</div>
                <div class="quest-description">Экономь воду 7 дней</div>
                <div class="progress-bar-container">
                    <div class="progress-bar" style="width: 50%;"></div>
                </div>
                <div class="progress-text">50%</div>
                <button class="action-btn">Подробнее</button>
            </div>
        </div>
    </main>
</body>
</html>
