<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>GreenEcoChain - Кошелек SECO</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --green-dark: #086B3C;
            --green-accent: #1FA84B;
            --token-color: #FFC107;
            --text-color: #000000;
            --header-dark: #2c2c2c;
            --card-bg: #FFFFFF;
            --trans-receive: #00C853;
            --trans-send: #FF3D00;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(180deg, #FFFFFF 0%, var(--green-dark) 100%);
            color: var(--text-color);
            min-height: 100vh;
        }

        header { width: 100%; position: sticky; top: 0; z-index: 1000; }
        .header-top { background: var(--header-dark); color: #FFFFFF; padding: 15px 5%; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 24px; font-weight: 800; letter-spacing: 1px; }
        .profile-circle { width: 36px; height: 36px; border-radius: 50%; background: #D8F6E8; color: var(--green-dark); font-weight: 700; display: flex; align-items: center; justify-content: center; font-size: 16px; }
        .navigation-bar { background: #FFFFFF; border-radius: 0 0 25px 25px; padding: 12px 5%; box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1); }
        .nav-links { display: flex; justify-content: space-around; list-style: none; max-width: 900px; margin: 0 auto; }
        .nav-link a { text-decoration: none; color: #333333; font-size: 15px; font-weight: 600; padding: 5px 15px; border-bottom: 3px solid transparent; }
        .nav-link.active a { color: var(--green-accent); border-bottom: 3px solid var(--green-accent); }

        .wallet-container { padding: 40px 5%; max-width: 700px; margin: 0 auto; }
        .main-title { font-size: 44px; font-weight: 800; color: #FFFFFF; margin-bottom: 30px; text-align: center; }

        .balance-card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
            text-align: center;
            margin-bottom: 30px;
            border-top: 5px solid var(--token-color);
        }
        .balance-card h2 { font-size: 20px; color: #555; font-weight: 600; }
        .balance-card strong { font-size: 48px; color: var(--token-color); font-weight: 800; display: block; margin-top: 5px; text-shadow: 0 2px 5px rgba(255,193,7,0.3); }
        .wallet-address {
            margin-top: 20px;
            padding: 10px 15px;
            background: #f8f8f8;
            border: 1px dashed #ccc;
            border-radius: 10px;
            font-size: 14px;
            font-family: monospace;
            overflow-x: auto;
        }

        .action-buttons { display: flex; justify-content: space-around; gap: 20px; margin-bottom: 30px; }
        .action-buttons button {
            flex-grow: 1;
            padding: 15px;
            border-radius: 10px;
            border: none;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s, transform 0.2s;
        }
        .send-btn { background: #E53935; color: white; }
        .receive-btn { background: var(--green-accent); color: white; }
        .action-buttons button:hover { transform: translateY(-2px); }

        .transaction-history h3 { font-size: 24px; color: var(--green-dark); margin-bottom: 20px; font-weight: 700; }
        .transaction-list {
            list-style: none;
            background: var(--card-bg);
            border-radius: 20px;
            padding: 0 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .transaction-item { display: flex; justify-content: space-between; align-items: center; padding: 15px 0; border-bottom: 1px solid #eee; }
        .transaction-item:last-child { border-bottom: none; }
        .trans-details { text-align: left; }
        .trans-details p { margin: 0; font-size: 14px; color: #555; }
        .trans-details strong { font-size: 16px; color: var(--green-dark); }
        .trans-amount { font-weight: 700; font-size: 18px; }
        .receive { color: var(--trans-receive); }
        .send { color: var(--trans-send); }

        /* --- МОДАЛЬНОЕ ОКНО --- */
        .modal { display: none; position: fixed; z-index: 2000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.4); padding-top: 60px; }
        .modal-content {
            background-color: #fefefe; margin: 5% auto; padding: 30px; border: 1px solid #888;
            width: 90%; max-width: 500px; border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.3); position: relative;
        }
        .close-btn { color: #aaa; float: right; font-size: 28px; font-weight: bold; position: absolute; top: 10px; right: 20px; }
        .close-btn:hover { color: #000; cursor: pointer; }
        .modal-content input, .modal-content button[type="submit"] {
            width: 100%; padding: 12px; margin-bottom: 15px; border-radius: 8px; border: 1px solid #ccc; font-size: 16px;
        }
        .modal-content button[type="submit"] { background: #E53935; color: white; font-weight: 700; border: none; }
    </style>
</head>
<body>

    <header>
        <div class="header-top">
            <div class="logo">ECOCHAIN</div>
            <div class="profile-circle">А</div>
        </div>
        <nav class="navigation-bar">
            <ul class="nav-links">
                <li class="nav-link"><a href="main-menu.html">Главное</a></li>
                <li class="nav-link active"><a href="wallet.html">Кошелек</a></li>
                
                <li class="nav-link"><a href="quest.html">Квест</a></li>
                <li class="nav-link"><a href="leaderboard.html">Лидеры</a></li>
                <li class="nav-link"><a href="games.html">Игры</a></li>
                <li class="nav-link"><a href="map.html">Карта</a></li>
                <li class="nav-link"><a href="rewards.html">Награды</a></li>
                <li class="nav-link"><a href="profile.html">Профиль</a></li>
                <li class="nav-link"><a href="settings.html">Настройки</a></li>
            </ul>
        </nav>
    </header>

    <main class="wallet-container">
        <h1 class="main-title">Мой Кошелек SECO 💰</h1>

        <div class="balance-card">
            <h2>Текущий баланс токенов:</h2>
            <strong id="balance">1950 SECO</strong>
            <div class="wallet-address" id="walletAddress">Адрес: не подключен</div>
        </div>
        
        <div class="action-buttons">
            <button class="send-btn" id="send-btn">Отправить токены</button>
            <button class="receive-btn" id="receive-btn">Получить токены</button>
        </div>

        <div class="transaction-history">
            <h3>История Транзакций</h3>
            <ul class="transaction-list" id="transaction-list"></ul>
        </div>
    </main>

    <div id="send-modal" class="modal">
      <div class="modal-content">
        <span class="close-btn">&times;</span>
        <h2>Отправка SECO</h2>
        <form id="sendForm">
          <input type="text" id="recipient-address" placeholder="Адрес получателя (0x...)" required>
          <input type="number" id="send-amount" placeholder="Сумма SECO" min="1" required>
          <button type="submit" class="send-btn">Подтвердить</button>
        </form>
      </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
    <script>
        const provider = new ethers.providers.Web3Provider(window.ethereum);
        let signer;
        let walletAddress = '';
        let balance = 1950; // начальный баланс
        const balanceElement = document.getElementById('balance');
        const txList = document.getElementById('transaction-list');

        // Подключение к MetaMask
        async function connectWallet() {
            // Проверка наличия Ethereum-провайдера (например, MetaMask)
            if (window.ethereum) {
                try {
                    const accounts = await provider.send("eth_requestAccounts", []);
                    signer = provider.getSigner();
                    walletAddress = accounts[0];
                    document.getElementById("walletAddress").innerText = "Адрес: " + walletAddress.slice(0,10) + "...";
                } catch (error) {
                    console.error("Пользователь отклонил подключение или произошла ошибка:", error);
                    document.getElementById("walletAddress").innerText = "Адрес: Ошибка подключения/Необходим MetaMask";
                }
            } else {
                 document.getElementById("walletAddress").innerText = "Адрес: MetaMask не найден";
            }
        }
        connectWallet();

        // Модальное окно
        const modal = document.getElementById("send-modal");
        const sendBtn = document.getElementById("send-btn");
        const closeBtn = document.getElementsByClassName("close-btn")[0];
        sendBtn.onclick = () => modal.style.display = "block";
        closeBtn.onclick = () => modal.style.display = "none";
        window.onclick = (e) => { if (e.target == modal) modal.style.display = "none"; };

        // Отправка токенов (имитация)
        document.getElementById("sendForm").onsubmit = async (e) => {
            e.preventDefault();
            const to = document.getElementById("recipient-address").value;
            const amount = parseInt(document.getElementById("send-amount").value);

            if (!to.startsWith('0x')) {
                alert("Адрес должен начинаться с '0x' (имитация блокчейн-адреса).");
                return;
            }
            if (amount <= 0 || isNaN(amount) || amount > balance) {
                alert("Недостаточно средств или неверная сумма!");
                return;
            }

            // Имитация отправки
            balance -= amount;
            updateBalance();
            addTransaction("Отправка токенов", `Адрес: ${to.slice(0, 10)}...`, -amount);
            modal.style.display = "none";
            alert(`✅ Успешно! Вывод ${amount} SECO на адрес ${to.slice(0, 10)}... подтвержден.`);
        };

        // Получение токенов (имитация)
        document.getElementById("receive-btn").onclick = () => {
             // alert('Ваш адрес кошелька для получения: ' + (walletAddress || '0xEcO2fA89D342B7C0...3e4Bb1A (имитация)'));
            const received = Math.floor(Math.random() * 100) + 10;
            balance += received;
            updateBalance();
            addTransaction("Пополнение", "Система вознаграждений", +received);
            alert(`🎉 Получено +${received} SECO от системы вознаграждений!`);
        };

        function updateBalance() {
            balanceElement.innerText = `${balance} SECO`;
        }

        function addTransaction(title, desc, amount) {
            const li = document.createElement("li");
            li.classList.add("transaction-item");
            li.innerHTML = `
                <div class="trans-details">
                    <strong>${title}</strong>
                    <p>${desc}</p>
                </div>
                <div class="trans-amount ${amount > 0 ? 'receive' : 'send'}">
                    ${amount > 0 ? '+' : ''}${amount} SECO
                </div>
            `;
            txList.prepend(li); // Добавляем новую транзакцию в начало списка
        }

        // Загрузка начальных имитационных транзакций
        addTransaction("Получение", "Выполнено: Викторина 'Лист или Хвоя'", +45);
        addTransaction("Расход", "Куплено: Электронная книга", -250);
        addTransaction("Получение", "Выполнено: Сбор 1 кг пластика", +20);
    </script>
</body>
</html>
