<!-- main-menu.html -->
<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>GreenEcoChain - Главное меню</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
/* Стили как в предыдущем main-menu.html */
</style>
</head>
<body>

<div class="main-wrapper">
    <div class="left-panel">
        <div class="logo-box"><div class="logo-text">EGC</div></div>
        <div class="app-name">ECOGREENCHAIN</div>
    </div>

    <div class="menu-panel">
        <h1 class="menu-title">Главное меню</h1>
        <div class="menu-grid">
            <a href="quest.html" class="menu-btn">Квесты 🌱</a>
            <a href="leaderboard.html" class="menu-btn">Таблица лидеров 🏆</a>
            <a href="profile.html" class="menu-btn">Профиль 👤</a>
            <a href="settings.html" class="menu-btn">Настройки ⚙</a>
            <a href="games.html" class="menu-btn games-button">Игры про деревья 🌲</a> 
            <a href="map.html" class="menu-btn map-rewards-button">Карта пунктов 🗺</a>
            <a href="rewards.html" class="menu-btn map-rewards-button">Награды 🎁</a>
            <a href="#" id="logout" class="logout-btn">Выйти</a>
        </div>
    </div>
</div>

<script>
// Проверяем авторизацию
if(localStorage.getItem('isLoggedIn') !== 'true'){
    window.location.href = 'index.html';
}

// Выход
document.getElementById('logout').addEventListener('click', ()=>{
    localStorage.removeItem('isLoggedIn');
    window.location.href = 'index.html';
});
</script>

</body>
</html>
