<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=1440, height=1024, initial-scale=1" />
  <title>GreenEcoChain — Кошелёк</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/ethers@6.6.0/dist/ethers.umd.min.js"></script>

  <style>
    :root {
      --green-dark: #0b8b4b;
      --green-accent: #4ac77c;
      --green-light: #d8f6e8;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: #f9fdfb;
      margin: 0;
      color: #222;
    }

    header {
      background: white;
      padding: 10px 30px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.05);
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .logo {
      font-size: 22px;
      font-weight: 700;
      color: var(--green-dark);
    }

    .header-icons {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .wallet-mini {
      background: var(--green-light);
      border-radius: 25px;
      padding: 6px 12px;
      color: var(--green-dark);
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
    }

    .wallet-mini:hover {
      background: var(--green-accent);
      color: white;
      transform: translateY(-2px);
    }

    .wallet-balance {
      font-weight: 700;
    }

    .profile-circle {
      background: var(--green-accent);
      color: white;
      font-weight: 700;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: 0.2s;
    }

    .profile-circle:hover {
      transform: scale(1.05);
    }

    nav ul {
      display: flex;
      gap: 15px;
      padding: 0;
      margin: 0;
      list-style: none;
    }

    .nav-link a {
      text-decoration: none;
      color: var(--green-dark);
      font-weight: 600;
      padding: 8px 14px;
      border-radius: 10px;
      transition: 0.2s;
    }

    .nav-link a:hover,
    .nav-link.active a {
      background: var(--green-accent);
      color: white;
    }

    main {
      padding: 40px;
      text-align: center;
    }

    .wallet-container {
      background: white;
      border-radius: 20px;
      box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
      max-width: 550px;
      margin: 40px auto;
      padding: 30px;
    }

    .wallet-container h2 {
      color: var(--green-dark);
      margin-bottom: 10px;
    }

    .wallet-amount {
      font-size: 32px;
      font-weight: 800;
      color: var(--green-accent);
      margin: 15px 0;
    }

    .wallet-actions {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin-top: 25px;
    }

    .wallet-actions button {
      background: var(--green-accent);
      color: white;
      border: none;
      border-radius: 10px;
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
      transition: 0.2s;
    }

    .wallet-actions button:hover {
      background: var(--green-dark);
    }

    .history {
      text-align: left;
      margin-top: 30px;
    }

    .history h3 {
      color: var(--green-dark);
      margin-bottom: 10px;
    }

    .history ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .history li {
      background: #f4fbf6;
      border-radius: 10px;
      margin-bottom: 8px;
      padding: 8px 12px;
      display: flex;
      justify-content: space-between;
      font-size: 14px;
    }

    .deposit {
      color: var(--green-dark);
    }

    .spend {
      color: #c73e3e;
    }
  </style>
</head>
<body>

<header>
  <div class="header-top">
    <div class="logo">GreenEcoChain</div>
    <div class="header-icons">
      <div class="wallet-mini" id="connectBtn">🔗 Подключить</div>
      <div class="wallet-mini">💰 <span id="miniBalance">0 SECO</span></div>
      <div class="profile-circle">А</div>
    </div>
  </div>

  <nav class="navigation-bar">
    <ul class="nav-links">
      <li class="nav-link"><a href="index.html">Главное</a></li>
      <li class="nav-link active"><a href="wallet.html">Кошелёк</a></li>
      <li class="nav-link"><a href="quest.html">Квест</a></li>
      <li class="nav-link"><a href="leaderboard.html">Лидеры</a></li>
      <li class="nav-link"><a href="games.html">Игры</a></li>
      <li class="nav-link"><a href="map.html">Карта</a></li>
      <li class="nav-link"><a href="rewards.html">Награды</a></li>
      <li class="nav-link"><a href="profile.html">Профиль</a></li>
      <li class="nav-link"><a href="settings.html">Настройки</a></li>
    </ul>
  </nav>
</header>

<main>
  <div class="wallet-container">
    <h2>Ваш кошелёк</h2>
    <div class="wallet-amount" id="walletDisplay">0 SECO</div>

    <div class="wallet-actions">
      <button onclick="depositTokens(100)">💵 Пополнить +100</button>
      <button onclick="spendTokens(50)">🛒 Потратить 50</button>
    </div>

    <div class="history">
      <h3>История платежей</h3>
      <ul id="txHistory"></ul>
    </div>
  </div>
</main>

<script>
const contractAddress = "0xYOUR_CONTRACT_ADDRESS"; // вставь адрес контракта
const abi = [
  "function deposit(uint256 amount) public",
  "function spend(uint256 amount) public",
  "function balances(address) public view returns (uint256)",
  "function getTransactions(address) public view returns (tuple(uint256 timestamp,string txType,uint256 amount)[])"
];

let provider, signer, contract, userAddress;

// Подключение к MetaMask
document.getElementById("connectBtn").addEventListener("click", async () => {
  if (!window.ethereum) return alert("Установите MetaMask!");
  provider = new ethers.BrowserProvider(window.ethereum);
  await provider.send("eth_requestAccounts", []);
  signer = await provider.getSigner();
  userAddress = await signer.getAddress();
  contract = new ethers.Contract(contractAddress, abi, signer);

  document.getElementById("connectBtn").textContent = userAddress.slice(0, 6) + "..." + userAddress.slice(-4);
  loadBalance();
  loadTransactions();
});

async function loadBalance() {
  const bal = await contract.balances(userAddress);
  document.getElementById("walletDisplay").textContent = `${bal} SECO`;
  document.getElementById("miniBalance").textContent = `${bal} SECO`;
}

async function depositTokens(amount) {
  await contract.deposit(amount);
  await loadBalance();
  await loadTransactions();
}

async function spendTokens(amount) {
  await contract.spend(amount);
  await loadBalance();
  await loadTransactions();
}

async function loadTransactions() {
  const txs = await contract.getTransactions(userAddress);
  const list = document.getElementById("txHistory");
  list.innerHTML = "";
  txs.slice().reverse().forEach(tx => {
    const date = new Date(tx.timestamp * 1000).toLocaleString();
    const li = document.createElement("li");
    li.innerHTML = `
      <span class="${tx.txType}">${tx.txType === "deposit" ? "Пополнение" : "Трата"}</span>
      <span>${tx.amount} SECO</span>
      <small>${date}</small>
    `;
    list.appendChild(li);
  });
}
</script>

</body>
</html>
