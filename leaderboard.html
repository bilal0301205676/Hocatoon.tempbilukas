<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>GreenEcoChain - Таблица лидеров</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --green-dark: #086B3C;
            --green-accent: #1FA84B;
            --token-color: #FFC107;
            --text-color: #000000;
            --header-dark: #2c2c2c;
            --card-bg: #FFFFFF;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(180deg, #FFFFFF 0%, var(--green-dark) 100%);
            color: var(--text-color);
            min-height: 100vh;
        }

        /* --- СТИЛИ ШАПКИ (HEADER) - Общие --- */
        header { width: 100%; position: sticky; top: 0; z-index: 1000; }
        .header-top { background: var(--header-dark); color: #FFFFFF; padding: 15px 5%; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 24px; font-weight: 800; letter-spacing: 1px; }
        .profile-circle { width: 36px; height: 36px; border-radius: 50%; background: #D8F6E8; color: var(--green-dark); font-weight: 700; display: flex; align-items: center; justify-content: center; font-size: 16px; }
        .navigation-bar { background: #FFFFFF; border-radius: 0 0 25px 25px; padding: 12px 5%; box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1); }
        .nav-links { display: flex; justify-content: space-around; list-style: none; max-width: 800px; margin: 0 auto; }
        .nav-link a { text-decoration: none; color: #333333; font-size: 15px; font-weight: 600; padding: 5px 15px; border-bottom: 3px solid transparent; }
        .nav-link.active a { color: var(--green-accent); border-bottom: 3px solid var(--green-accent); }

        /* --- СТИЛИ КОНТЕНТА --- */
        .leaderboard-container {
            padding: 40px 5%; 
            max-width: 800px; 
            margin: 0 auto;
        }
        .main-title {
            font-size: 44px; 
            font-weight: 800; 
            color: #FFFFFF;
            margin-bottom: 30px;
            text-align: center;
        }

        .leaderboard-card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
        }

        .leader-table {
            width: 100%;
            border-collapse: collapse;
        }
        .leader-table th, .leader-table td {
            padding: 12px 10px;
            text-align: left;
            border-bottom: 1px solid #eee;
        }
        .leader-table th {
            background: #f8f8f8;
            color: var(--green-dark);
            font-size: 16px;
            font-weight: 700;
        }

        .rank-1 {
            background: #FFD700; /* Золото */
            font-weight: 800;
        }
        .rank-2 {
            background: #C0C0C0; /* Серебро */
        }
        .rank-3 {
            background: #CD7F32; /* Бронза */
        }
        .leader-table tr:nth-child(even):not(.rank-1):not(.rank-2):not(.rank-3) {
            background-color: #fcfcfc;
        }
        
        .user-row {
            background-color: #D8F6E8 !important; /* Выделение своей строки */
            font-weight: 700;
        }
        
        .score {
            font-weight: 800;
            color: var(--green-accent);
        }
    </style>
</head>
<body>

    <header>
        <div class="header-top">
            <div class="logo">ECOCHAIN</div>
            <div class="profile-circle">А</div>
        </div>
        <nav class="navigation-bar">
            <ul class="nav-links">
                <li class="nav-link"><a href="index.html">Главное</a></li>
                <li class="nav-link"><a href="quest.html">Квест</a></li>
                <li class="nav-link active"><a href="leaderboard.html">Таблица лидеров</a></li>
                <li class="nav-link"><a href="games.html">Игры</a></li>
                <li class="nav-link"><a href="map.html">Карта</a></li>
                <li class="nav-link"><a href="rewards.html">Награды</a></li>
                <li class="nav-link"><a href="profile.html">Профиль</a></li>
                <li class="nav-link"><a href="settings.html">Настройки</a></li>
            </ul>
        </nav>
    </header>

    <main class="leaderboard-container">
        <h1 class="main-title">Таблица лидеров 🏆</h1>

        <div class="leaderboard-card">
            <table class="leader-table">
                <thead>
                    <tr>
                        <th>Место</th>
                        <th>Пользователь</th>
                        <th style="text-align: right;">Очки (SECO)</th>
                    </tr>
                </thead>
                <tbody>
                    <tr class="rank-1">
                        <td>🥇</td>
                        <td>Екатерина Л.</td>
                        <td style="text-align: right;" class="score">3240</td>
                    </tr>
                    <tr class="rank-2">
                        <td>🥈</td>
                        <td>Иван П.</td>
                        <td style="text-align: right;" class="score">2890</td>
                    </tr>
                    <tr class="rank-3">
                        <td>🥉</td>
                        <td>Марина В.</td>
                        <td style="text-align: right;" class="score">2510</td>
                    </tr>
                    <tr>
                        <td>4</td>
                        <td>Сергей К.</td>
                        <td style="text-align: right;" class="score">2100</td>
                    </tr>
                    <tr class="user-row">
                        <td>5</td>
                        <td>Алексей С. (Вы)</td>
                        <td style="text-align: right;" class="score">1950</td>
                    </tr>
                    <tr>
                        <td>6</td>
                        <td>Ольга Н.</td>
                        <td style="text-align: right;" class="score">1870</td>
                    </tr>
                    <tr>
                        <td>7</td>
                        <td>Дмитрий Ч.</td>
                        <td style="text-align: right;" class="score">1500</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>

</body>
</html>
