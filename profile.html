<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>GreenEcoChain - Профиль</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --green-dark: #086B3C;
            --green-accent: #1FA84B;
            --token-color: #FFC107;
            --text-color: #000000;
            --header-dark: #2c2c2c;
            --card-bg: #FFFFFF;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(180deg, #FFFFFF 0%, var(--green-dark) 100%);
            color: var(--text-color);
            min-height: 100vh;
        }

        /* --- СТИЛИ ШАПКИ (HEADER) - Общие --- */
        header { width: 100%; position: sticky; top: 0; z-index: 1000; }
        .header-top { background: var(--header-dark); color: #FFFFFF; padding: 15px 5%; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 24px; font-weight: 800; letter-spacing: 1px; }
        .profile-circle { width: 36px; height: 36px; border-radius: 50%; background: #D8F6E8; color: var(--green-dark); font-weight: 700; display: flex; align-items: center; justify-content: center; font-size: 16px; }
        .navigation-bar { background: #FFFFFF; border-radius: 0 0 25px 25px; padding: 12px 5%; box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1); }
        .nav-links { display: flex; justify-content: space-around; list-style: none; max-width: 800px; margin: 0 auto; }
        .nav-link a { text-decoration: none; color: #333333; font-size: 15px; font-weight: 600; padding: 5px 15px; border-bottom: 3px solid transparent; }
        .nav-link.active a { color: var(--green-accent); border-bottom: 3px solid var(--green-accent); }

        /* --- СТИЛИ КОНТЕНТА --- */
        .profile-container {
            padding: 40px 5%; 
            max-width: 700px; 
            margin: 0 auto;
        }
        .main-title {
            font-size: 44px; 
            font-weight: 800; 
            color: #FFFFFF;
            margin-bottom: 30px;
            text-align: center;
        }

        .profile-card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
            text-align: center;
        }

        .avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: var(--green-accent);
            color: white;
            font-size: 48px;
            font-weight: 700;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 15px;
            border: 5px solid #E8FFF0;
        }

        .username {
            font-size: 32px;
            font-weight: 800;
            color: var(--green-dark);
            margin-bottom: 10px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-top: 30px;
        }

        .stat-item {
            padding: 15px;
            background: #F0FFF0;
            border-radius: 10px;
        }

        .stat-value {
            font-size: 24px;
            font-weight: 800;
            color: var(--green-accent);
            margin-bottom: 5px;
        }

        .stat-value.tokens {
            color: var(--token-color);
        }

        .stat-label {
            font-size: 14px;
            color: #555;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <header>
        <div class="header-top">
            <div class="logo">ECOCHAIN</div>
            <div class="profile-circle">А</div>
        </div>
        <nav class="navigation-bar">
            <ul class="nav-links">
                <li class="nav-link"><a href="index.html">Главное</a></li>
                <li class="nav-link"><a href="quest.html">Квест</a></li>
                <li class="nav-link"><a href="leaderboard.html">Таблица лидеров</a></li>
                <li class="nav-link"><a href="games.html">Игры</a></li>
                <li class="nav-link"><a href="map.html">Карта</a></li>
                <li class="nav-link"><a href="rewards.html">Награды</a></li>
                <li class="nav-link active"><a href="profile.html">Профиль</a></li>
                <li class="nav-link"><a href="settings.html">Настройки</a></li>
            </ul>
        </nav>
    </header>

    <main class="profile-container">
        <h1 class="main-title">Мой Профиль 👤</h1>

        <div class="profile-card">
            <div class="avatar">А</div>
            <div class="username">Алексей Смирнов</div>
            <p>Место в рейтинге: 5 из 100</p>

            <div class="stats-grid">
                <div class="stat-item">
                    <div class="stat-value tokens">1950</div>
                    <div class="stat-label">Всего SECO токенов</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value">12</div>
                    <div class="stat-label">Выполненных квестов</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value">4</div>
                    <div class="stat-label">Посаженных деревьев</div>
                </div>
            </div>
            
            <a href="settings.html" style="margin-top: 30px; display: inline-block; color: #1E88E5; font-weight: 600;">Редактировать профиль</a>
        </div>
    </main>

</body>
</html>
