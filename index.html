<!-- index.html -->
<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>GreenEcoChain — Вход и Регистрация</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
/* Стили те же, что у тебя были */
</style>
</head>
<body>

<div class="wrapper">
    <div class="left-panel">
        <div class="logo-box"><div class="logo-text">EGC</div></div>
        <div class="app-name">ECOGREENCHAIN</div>
    </div>

    <div class="auth-panel">
        <div class="tabs">
            <div class="tab active" data-mode="login">Вход</div>
            <div class="tab" data-mode="register">Регистрация</div>
        </div>

        <h1 id="auth-title">Добро пожаловать</h1>

        <form class="auth-form" id="auth-form">
            <label for="email">Email</label>
            <input type="email" id="email" placeholder="you@example.com" required>

            <label for="password">Пароль</label>
            <input type="password" id="password" placeholder="••••••••" required>

            <label class="remember">
                <input type="checkbox" id="remember">
                Запомнить меня
            </label>

            <button type="submit" id="submit-btn">Войти</button>
        </form>
    </div>
</div>

<script>
const tabs = document.querySelectorAll('.tab');
const authTitle = document.getElementById('auth-title');
const submitBtn = document.getElementById('submit-btn');
const form = document.getElementById('auth-form');
const emailInput = document.getElementById('email');
let currentMode = 'login';

if(localStorage.getItem('savedEmail')){
    emailInput.value = localStorage.getItem('savedEmail');
    document.getElementById('remember').checked = true;
}

tabs.forEach(tab=>{
    tab.addEventListener('click', ()=>{
        tabs.forEach(t=>t.classList.remove('active'));
        tab.classList.add('active');
        currentMode = tab.dataset.mode;
        authTitle.textContent = currentMode==='login' ? 'Добро пожаловать' : 'Создайте аккаунт';
        submitBtn.textContent = currentMode==='login' ? 'Войти' : 'Зарегистрироваться';
    });
});

function validateEmail(email){
    const re = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    return re.test(email.toLowerCase());
}

form.addEventListener('submit', e=>{
    e.preventDefault();
    const email = emailInput.value.trim();
    const password = document.getElementById('password').value.trim();
    if(!email || !password){ alert('Заполните все поля.'); return; }
    if(!validateEmail(email)){ alert('Введите корректный email.'); return; }
    if(document.getElementById('remember').checked){ localStorage.setItem('savedEmail', email); }
    else { localStorage.removeItem('savedEmail'); }

    // Сохраняем статус входа
    localStorage.setItem('isLoggedIn', 'true');

    // Переход на главное меню
    window.location.href = 'main-menu.html';
});
</script>

</body>
</html>
