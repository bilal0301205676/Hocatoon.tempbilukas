<!doctype html>
<html lang="ru">
<head>
  
  <meta charset="utf-8" />
  <meta name="viewport" content="width=1440, height=1024, initial-scale=1" />
  <title>GreenEcoChain — Вход и Меню</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

  <style>
    :root{
      --green-1: #0f8e4e;
      --green-2: #0a6b44;
      --accent: #28a745;
      --accent-dark: #0e8b3f;
      --input-bg: #ffffff;
      --shadow: 0 8px 30px rgba(8,40,20,0.25);
      --radius-big: 60px;
    }

    *{ box-sizing:border-box; margin:0; padding:0; }
    html,body{
      width:1440px;
      height:1024px;
      overflow:hidden;
      font-family:"Inter", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
      color:#0b2b1b;
      background: linear-gradient(180deg, #FFFFFF 0%, #086B3C 100%);
      display:flex;
      align-items:center;
      justify-content:center;
    }

    .page{
      width:1280px;
      height:880px;
      display:grid;
      grid-template-columns: 360px 1fr;
      gap:40px;
      align-items:center;
      justify-content:center;
      background:rgba(255,255,255,0.05);
      border-radius:40px;
      padding:20px 40px;
    }

    .left{
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:flex-start;
      gap:20px;
      min-height:520px;
      padding-top:20px;
    }

    .logo-wrap{
      display:flex;
      align-items:center;
      justify-content:center;
      width:240px;
      height:240px;
      border-radius:18px;
      background: linear-gradient(180deg, #b8f0cd 0%, #199356 50%, #0b6a44 100%);
      box-shadow: 0 6px 30px rgba(6,60,40,0.35);
    }

    .logo-wrap svg{ width:70%; height:70%; }

    .logo-text{
      font-weight:800;
      color:rgba(245,255,245,0.95);
      letter-spacing:4px;
      font-size:26px;
      text-transform:uppercase;
      margin-top:20px;
    }

    .card-wrap{
      display:flex;
      align-items:center;
      justify-content:center;
      height:100%;
    }

    .card{
      width:100%;
      max-width:760px;
      background: linear-gradient(180deg, rgba(255,255,255,0.8), rgba(230,255,245,0.5));
      border-radius: var(--radius-big);
      padding:48px 64px;
      box-shadow: var(--shadow);
      position:relative;
      backdrop-filter: blur(8px) saturate(1.1);
    }

    .card-top{
      display:flex;
      align-items:center;
      gap:18px;
      margin-bottom:8px;
    }

    .mini-logo{
      width:44px;
      height:44px;
      border-radius:8px;
      background: linear-gradient(180deg, #9ff0c8, #53c992);
      display:flex;
      align-items:center;
      justify-content:center;
      box-shadow: 0 3px 10px rgba(6,60,40,0.18);
    }

    .tabs{
      margin-left:auto;
      display:flex;
      gap:10px;
      align-items:center;
    }

    .tab{
      padding:10px 20px;
      border-radius:24px;
      font-weight:600;
      font-size:15px;
      cursor:pointer;
      user-select:none;
      transition:all 0.2s;
    }

    .tab.active{
      background: linear-gradient(90deg, #24b14d, #1b9a3c);
      color:white;
      box-shadow:0 3px 8px rgba(10,80,40,0.18);
    }

    .tab:not(.active){
      background:rgba(255,255,255,0.6);
      color:rgba(5,45,20,0.7);
    }

    h1{
      font-size:44px;
      margin:18px 0 28px 0;
      font-weight:600;
      color:#072916;
    }

    form{
      display:flex;
      flex-direction:column;
      gap:18px;
    }

    label{
      font-size:14px;
      font-weight:600;
      color:#16462f;
    }

    .input{
      width:100%;
      padding:18px 22px;
      border-radius:24px;
      border:none;
      background:var(--input-bg);
      box-shadow:0 6px 18px rgba(2,20,10,0.06);
      font-size:15px;
      outline:none;
    }

    .submit{
      margin-top:8px;
      width:fit-content;
      background:linear-gradient(180deg,var(--accent),var(--accent-dark));
      color:white;
      padding:14px 26px;
      border-radius:28px;
      border:none;
      font-weight:700;
      cursor:pointer;
      box-shadow:0 8px 20px rgba(11,110,60,0.18);
    }

    .submit:hover{ background:var(--accent-dark); }

    .socials{
      margin-top:28px;
      display:flex;
      gap:18px;
      justify-content:center;
    }

    .social{
      width:54px;
      height:54px;
      border-radius:50%;
      background:rgba(255,255,255,0.9);
      display:flex;
      align-items:center;
      justify-content:center;
      box-shadow:0 6px 18px rgba(0,0,0,0.08);
      cursor:pointer;
      transition: transform 0.1s;
    }

    .social:hover { transform: scale(1.05); }

    #main-menu{ display:none; text-align:center; }
    .menu-grid{
      display:grid;
      grid-template-columns:repeat(2,1fr);
      gap:20px;
      margin-top:40px;
    }
    .menu-button{
      padding:25px 15px;
      background:linear-gradient(180deg,#5ebf7a,#63d582);
      color:white;
      border:none;
      border-radius:20px;
      font-size:18px;
      font-weight:700;
      cursor:pointer;
      transition:transform 0.2s;
    }
    .menu-button:hover{
      transform:translateY(-3px);
      box-shadow:0 8px 20px rgba(11,110,60,0.25);
    }
  </style>
</head>
<body>

<div class="wrapper">
    <div class="left-panel">
        <div class="logo-box"><div class="logo-text">EGC</div></div>
        <div class="app-name">GreenEcoChain</div>
    </div>

    <div class="auth-panel">
        <div class="tabs">
            <div class="tab active" data-mode="login">Вход</div>
            <div class="tab" data-mode="register">Регистрация</div>
        </div>

        <h1 id="auth-title">Добро пожаловать</h1>

        <form class="auth-form" id="auth-form">
            <label for="email">Email</label>
            <input type="email" id="email" placeholder="you@example.com" required="">

            <label for="password">Пароль</label>
            <input type="password" id="password" placeholder="••••••••" required="">

            <label class="remember">
                <input type="checkbox" id="remember">
                Запомнить меня
            </label>

            <button type="submit" id="submit-btn">Войти</button>
        </form>
    </div>
</div>



<script>
const tabs = document.querySelectorAll('.tab');
const authTitle = document.getElementById('auth-title');
const submitBtn = document.getElementById('submit-btn');
const form = document.getElementById('auth-form');
const emailInput = document.getElementById('email');
let currentMode = 'login';

if(localStorage.getItem('savedEmail')){
    emailInput.value = localStorage.getItem('savedEmail');
    document.getElementById('remember').checked = true;
}

tabs.forEach(tab=>{
    tab.addEventListener('click', ()=>{
        tabs.forEach(t=>t.classList.remove('active'));
        tab.classList.add('active');
        currentMode = tab.dataset.mode;
        if(currentMode==='login'){
            authTitle.textContent = 'Добро пожаловать';
            submitBtn.textContent = 'Войти';
        } else {
            authTitle.textContent = 'Создайте аккаунт';
            submitBtn.textContent = 'Зарегистрироваться';
        }
    });
});

function validateEmail(email){
    const re = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    return re.test(email.toLowerCase());
}

form.addEventListener('submit', e=>{
    e.preventDefault();
    const email = emailInput.value.trim();
    const password = document.getElementById('password').value.trim();

    if(!email || !password){
        alert('Пожалуйста, заполните все поля.');
        return;
    }
    if(!validateEmail(email)){
        alert('Введите корректный email.');
        return;
    }

    if(document.getElementById('remember').checked){
        localStorage.setItem('savedEmail', email);
    } else {
        localStorage.removeItem('savedEmail');
    }

    // Переход на главное меню
    window.location.href = 'main-menu.html';
});
</script>

</body></html>
