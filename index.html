<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>ECOCHAIN - Главное меню</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        /* Общие переменные для всего приложения */
        :root {
            --green-dark: #086B3C;
            --green-accent: #1FA84B;
            --main-card-bg: #FFFFFF;
            --btn-green: #4CAF50;
            --btn-yellow: #FFC107;
            --btn-red: #E53935;
            --btn-blue: #17A2B8;
            --text-color: #333;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', sans-serif;
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column; /* Изменено для размещения шапки */
            align-items: center;
            background: linear-gradient(180deg, #FFFFFF 0%, var(--green-dark) 100%);
        }
        
        /* ======= ШАПКА (HEADER/NAVBAR) - ECOCHAIN ======= */
        .header {
            background-color: var(--green-dark);
            color: #ffffff;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 40px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            width: 100%; /* Шапка на всю ширину */
        }
        .header-logo {
            font-size: 24px;
            font-weight: 800;
            letter-spacing: 2px;
            cursor: pointer;
        }
        .header-nav {
            display: flex;
            gap: 20px;
        }
        .header-nav a {
            color: #ffffff;
            text-decoration: none;
            font-weight: 600;
            padding: 5px 0;
            transition: color 0.2s, border-bottom 0.2s;
            border-bottom: 3px solid transparent;
        }
        .header-nav a:hover, .header-nav a.active {
            color: #A7D8A7;
            border-bottom: 3px solid #A7D8A7;
        }
        .header-account {
            background: var(--btn-green);
            color: #ffffff;
            border: none;
            border-radius: 50%;
            width: 35px;
            height: 35px;
            font-weight: 700;
            cursor: pointer;
        }
        
        /* ======= ОСНОВНОЕ МЕНЮ (КОНТЕНТ) ======= */
        .menu-content-wrapper {
            flex-grow: 1; /* Чтобы контент занимал оставшееся место */
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
        }

        .main-wrapper {
            max-width: 1000px;
            width: 90%; /* Немного уменьшил для отступов */
            display: flex;
            background: rgba(255, 255, 255, 0.85); 
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            border-radius: 30px;
            overflow: hidden; 
            margin: 40px 0; /* Отступ сверху и снизу от шапки/футера */
        }

        /* Остальные стили для меню (как в предыдущем ответе) */
        .left-panel {
            background: linear-gradient(135deg, #A7D8A7, var(--green-dark));
            width: 35%;
            padding: 40px;
            border-radius: 30px 0 0 30px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }
        .logo-box {
            width: 120px;
            height: 120px;
            background: linear-gradient(135deg, var(--green-accent), #054C2D); 
            border-radius: 10px;
            transform: rotate(45deg);
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 30px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.3);
        }
        .logo-text {
            color: #FFFFFF;
            font-size: 32px;
            font-weight: 800;
            transform: rotate(-45deg);
        }
        .app-name {
            color: #FFFFFF;
            font-size: 24px;
            font-weight: 700;
            letter-spacing: 2px;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.5); 
        }

        .menu-panel {
            background: var(--main-card-bg);
            width: 65%;
            padding: 50px;
            border-radius: 0 30px 30px 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .menu-title {
            font-size: 36px;
            font-weight: 800;
            color: var(--green-dark);
            margin-bottom: 40px;
        }
        .menu-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            width: 100%;
            max-width: 600px;
            margin-bottom: 30px;
        }

        .menu-btn, .logout-btn {
            padding: 15px 25px;
            border-radius: 15px;
            border: none;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            text-decoration: none; 
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }
        .menu-btn {
            background: var(--btn-green);
            color: #FFFFFF;
            box-shadow: 0 4px 10px rgba(76, 175, 80, 0.4);
        }
        .menu-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 15px rgba(76, 175, 80, 0.6);
        }
        .menu-btn.games-button {
            background: var(--btn-yellow);
            color: var(--text-color);
            grid-column: span 2; 
            box-shadow: 0 4px 10px rgba(255, 193, 7, 0.5);
        }
        .menu-btn.map-rewards-button {
            background: var(--btn-blue);
            color: #FFFFFF;
        }
        .logout-btn {
            grid-column: span 2;
            background: var(--btn-red);
            color: #FFFFFF;
            box-shadow: 0 4px 10px rgba(229, 57, 53, 0.4);
        }
        .logout-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 15px rgba(229, 57, 53, 0.6);
        }

        /* Адаптивный дизайн */
        @media (max-width: 768px) {
            .header {
                padding: 10px 20px;
            }
            .header-nav {
                display: none; /* Скрываем меню на маленьких экранах */
            }
            .main-wrapper {
                flex-direction: column;
                border-radius: 30px;
            }
            .left-panel, .menu-panel {
                width: 100%;
                border-radius: 30px 30px 0 0;
                padding: 30px;
            }
            .menu-panel {
                border-radius: 0 0 30px 30px;
            }
            .menu-grid {
                grid-template-columns: 1fr;
            }
            .menu-btn.games-button, .logout-btn {
                grid-column: span 1;
            }
        }
    </style>
</head>
<body>

    <header class="header">
        <div class="header-logo">ECOCHAIN</div>
        <nav class="header-nav">
            <a href="index.html" class="active">Главное</a> <a href="quest.html">Квест</a>
            <a href="leaderboard.html">Таблица лидеров</a>
            <a href="games.html">Игры</a>
            <a href="map.html">Карта</a>
            <a href="rewards.html">Награды</a>
            <a href="profile.html">Профиль</a>
            <a href="settings.html">Настройки</a>
        </nav>
        <button class="header-account">A</button>
    </header>

    <div class="menu-content-wrapper">
        <div class="main-wrapper">
            <div class="left-panel">
                <div class="logo-box">
                    <div class="logo-text">EGC</div>
                </div>
                <div class="app-name">ECOGREENCHAIN</div>
            </div>

            <div class="menu-panel">
                <h1 class="menu-title">Главное меню</h1>

                <div class="menu-grid">
                    <a href="quest.html" class="menu-btn">Квесты 🌱</a>
                    <a href="leaderboard.html" class="menu-btn">Таблица лидеров 🏆</a>
                    <a href="profile.html" class="menu-btn">Профиль 👤</a>
                    <a href="settings.html" class="menu-btn">Настройки ⚙️</a>
                    
                    <a href="games.html" class="menu-btn games-button">Игры про деревья 🌲</a> 

                    <a href="map.html" class="menu-btn map-rewards-button">Карта пунктов 🗺️</a>
                    <a href="rewards.html" class="menu-btn map-rewards-button">Награды (Магазин) 🎁</a>
                    
                    <a href="login.html" onclick="logoutUser(event)" class="logout-btn">Выйти</a>
                </div>
            </div>
        </div>
    </div>

    <script>
        function logoutUser(event) {
            event.preventDefault(); 
            // Здесь должна быть логика выхода из системы (например, Firebase)
            window.location.href = 'login.html';
        }
    </script>
</body>
</html>
