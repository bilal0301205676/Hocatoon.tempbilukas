<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>GreenEcoChain - Награды</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --green-dark: #086B3C;
            --green-accent: #1FA84B;
            --header-dark: #2c2c2c;
            --card-bg: #FFFFFF;
            --token-color: #FFC107; /* Желтый для токенов */
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(180deg, #FFFFFF 0%, var(--green-dark) 100%);
            color: var(--text-color);
            min-height: 100vh;
        }

        /* --- СТИЛИ ШАПКИ (HEADER) - Общие --- */
        header { width: 100%; position: sticky; top: 0; z-index: 1000; }
        .header-top { background: var(--header-dark); color: #FFFFFF; padding: 15px 5%; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 24px; font-weight: 800; letter-spacing: 1px; }
        .profile-circle { width: 36px; height: 36px; border-radius: 50%; background: #D8F6E8; color: var(--green-dark); font-weight: 700; display: flex; align-items: center; justify-content: center; font-size: 16px; }
        .navigation-bar { background: #FFFFFF; border-radius: 0 0 25px 25px; padding: 12px 5%; box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1); }
        .nav-links { display: flex; justify-content: space-around; list-style: none; max-width: 900px; margin: 0 auto; }
        .nav-link a { text-decoration: none; color: #333333; font-size: 15px; font-weight: 600; padding: 5px 15px; border-bottom: 3px solid transparent; }
        .nav-link.active a { color: var(--green-accent); border-bottom: 3px solid var(--green-accent); }
        
        /* --- СТИЛИ НАГРАД --- */
        .rewards-container {
            padding: 40px 5%; 
            max-width: 1200px; 
            margin: 0 auto;
        }
        .main-title {
            font-size: 44px; 
            font-weight: 800; 
            color: #FFFFFF;
            margin-bottom: 30px;
            text-align: center;
        }

        .balance-info {
            background: var(--card-bg);
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            margin-bottom: 30px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }
        .balance-info h2 {
            font-size: 20px;
            color: #555;
            font-weight: 600;
        }
        .balance-info strong {
            font-size: 36px;
            color: var(--token-color);
            font-weight: 800;
            display: block;
            margin-top: 5px;
        }

        .rewards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 30px;
        }

        .reward-card {
            background: var(--card-bg);
            border-radius: 20px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            text-align: center;
        }

        .reward-image {
            width: 100%;
            height: 200px;
            background: #D8F6E8; /* Заглушка */
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 40px;
            font-weight: 800;
        }

        .reward-details {
            padding: 20px;
        }

        .reward-title {
            font-size: 22px;
            font-weight: 800;
            color: var(--green-dark);
            margin-bottom: 10px;
        }

        .reward-price {
            font-size: 24px;
            font-weight: 800;
            color: var(--token-color);
            margin-bottom: 20px;
        }
        .reward-price span {
            font-size: 16px;
            font-weight: 600;
            color: #555;
            margin-left: 5px;
        }

        .buy-btn {
            display: block;
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: none;
            background: var(--green-accent);
            color: white;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s;
        }
        .buy-btn:hover { background: #198754; }
    </style>
</head>
<body>

    <header>
        <div class="header-top">
            <div class="logo">ECOCHAIN</div>
            <div class="profile-circle">А</div>
        </div>
        <nav class="navigation-bar">
            <ul class="nav-links">
                <li class="nav-link"><a href="index.html">Главное</a></li>
                <li class="nav-link"><a href="quest.html">Квест</a></li>
                <li class="nav-link"><a href="leaderboard.html">Таблица лидеров</a></li>
                <li class="nav-link"><a href="games.html">Игры</a></li>
                <li class="nav-link"><a href="map.html">Карта</a></li>
                <li class="nav-link active"><a href="rewards.html">Награды</a></li>
                <li class="nav-link"><a href="profile.html">Профиль</a></li>
                <li class="nav-link"><a href="settings.html">Настройки</a></li>
            </ul>
        </nav>
    </header>

    <main class="rewards-container">
        <h1 class="main-title">Каталог Эко-Наград</h1>

        <div class="balance-info">
            <h2>Ваш текущий баланс:</h2>
            <strong>1950 SECO</strong>
        </div>

        <div class="rewards-grid">
            
            <div class="reward-card">
                <div class="reward-image">🌱</div>
                <div class="reward-details">
                    <div class="reward-title">Посадка вашего дерева</div>
                    <div class="reward-price">3000 <span>SECO</span></div>
                    <button class="buy-btn">Купить</button>
                </div>
            </div>
            
            <div class="reward-card">
                <div class="reward-image">☕</div>
                <div class="reward-details">
                    <div class="reward-title">Скидка 10% в эко-кофейне</div>
                    <div class="reward-price">500 <span>SECO</span></div>
                    <button class="buy-btn">Купить</button>
                </div>
            </div>

            <div class="reward-card">
                <div class="reward-image">📘</div>
                <div class="reward-details">
                    <div class="reward-title">Электронная книга об экологии</div>
                    <div class="reward-price">250 <span>SECO</span></div>
                    <button class="buy-btn">Купить</button>
                </div>
            </div>
            
        </div>
    </main>

</body>
</html>
