<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>О EcoGreenChain</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800&family=Roboto:wght@400&display=swap" rel="stylesheet">
    <style>
        /* Общие стили для тела страницы */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Roboto', sans-serif;
            color: #ffffff;
            text-align: center;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            
            /* Градиентный фон */
            background: linear-gradient(180deg, #4CAF50 0%, #00796B 100%);
        }

        /* Контейнер */
        .content-wrapper {
            max-width: 800px;
            padding: 20px;
            box-sizing: border-box;
        }

        /* Стили для логотипа (SVG) */
        .logo-container {
            width: 100px;
            height: 100px;
            margin: 0 auto 20px;
        }

        .logo-icon {
            width: 100%;
            height: 100%;
        }

        /* Стили для заголовка "EcoGreenChain" */
        .main-title {
            font-family: 'Montserrat', sans-serif;
            font-size: 4em;
            font-weight: 800;
            color: #000000;
            margin-bottom: 30px;
            line-height: 1.2;
        }

        /* Стили для описательного текста */
        .description-text {
            font-size: 1.5em;
            line-height: 1.6;
            font-weight: 400;
            margin-bottom: 50px;
            padding: 0 5%;
        }

        /* Стили для кнопки "Войти" */
        .action-button {
            display: inline-block;
            padding: 15px 40px;
            /* Градиентный фон кнопки */
            background: linear-gradient(180deg, #66BB6A 0%, #00A350 100%); 
            color: #ffffff;
            text-decoration: none;
            font-size: 1.2em;
            font-weight: 700;
            border-radius: 50px;
            border: none;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
            transition: transform 0.2s, box-shadow 0.2s;
            cursor: pointer;
        }

        .action-button:hover {
            background: linear-gradient(180deg, #81C784 0%, #388E3C 100%);
            transform: translateY(-2px);
            box-shadow: 0 6px 8px rgba(0, 0, 0, 0.3);
        }
    </style>
</head>
<body>
    <div class="content-wrapper">
        
        <div class="logo-container">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" class="logo-icon">
                <polygon points="50,0 75,50 50,65 25,50" fill="#69F0AE"/> 
                <polygon points="50,65 75,50 50,100 25,50" fill="#00E676"/> 
                <polygon points="50,0 75,50 50,65 25,50" fill="none" stroke="#00C853" stroke-width="2"/>
                <polygon points="50,65 75,50 50,100 25,50" fill="none" stroke="#00C853" stroke-width="2"/>
            </svg>
        </div>
        
        <h1 class="main-title">EcoGreenChain</h1>
        
        <p class="description-text">
            Этот сайт для поддерживания экологии за выполнение задания дается токены которые можно обменять на криптовалюты
        </p>
        
        <a href="login.html" class="action-button">Войти</a>
        
    </div>
</body>
</html>
